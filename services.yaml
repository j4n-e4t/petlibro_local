feed:
  name: Feed
  description: Trigger manual feeding with a specified number of portions.
  fields:
    device_id:
      name: Device
      description: The Petlibro device to feed from.
      required: true
      selector:
        device:
          integration: petlibro_local
    portions:
      name: Portions
      description: Number of portions to dispense.
      required: true
      example: 1
      default: 1
      selector:
        number:
          min: 1
          max: 10
          mode: slider

send_command:
  name: Send Command
  description: Send a command to a Petlibro device.
  fields:
    device_id:
      name: Device
      description: The Petlibro device to send the command to.
      required: true
      selector:
        device:
          integration: petlibro_local
    cmd:
      name: Command
      description: The command to send.
      required: true
      example: "getDeviceInfo"
      selector:
        text:
    payload:
      name: Payload
      description: Additional payload data as a dictionary.
      required: false
      example: '{"param1": "value1"}'
      selector:
        object:
